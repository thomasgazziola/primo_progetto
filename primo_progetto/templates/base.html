
{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Punto 4: Tag title con blocco Django -->
    <title>{% block title %} Primo progetto {% endblock title %}</title>

    <!-- Punto 6: Risorse Bootstrap (CSS e JS) inserite nell'head -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>

    <!-- Punto 5: Navbar Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        
        <!-- 5.a: Navbar-brand "Primo progetto" -->
        <a class="navbar-brand" href="#">Primo progetto</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li>
              <a class="nav-link" href="{% url 'prima_app:homepage'%}">homepage</a>
            </li>
            
            <!-- 5.b: Menu dropdown "Prima app" -->
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="primaAppDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Prima app
              </a>
              <ul class="dropdown-menu" aria-labelledby="primaAppDropdown">
                <li><a class="dropdown-item" href="{% url 'prima_app:welcome'%}">Welcome</a></li>
                <li><a class="dropdown-item" href="{% url 'prima_app:chi_siamo'%}">Chi Siamo</a></li>
                <li><a class="dropdown-item" href="{% url 'prima_app:variabili'%}">Variabili</a></li>
                 <li><a class="dropdown-item" href="{% url 'prima_app:index'%}">Index</a></li>
              </ul>

            <!-- 5.c: Menu dropdown "Seconda app" -->
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="secondaAppDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Seconda app
              </a>
              <ul class="dropdown-menu" aria-labelledby="secondaAppDropdown">
                <!-- Sostituire o collegare qui le voci presenti nell'index della Seconda app -->
                <li><a class="dropdown-item" href="{% url 'seconda_app:es_if'%}">es_if</a></li>
              </ul>
            </li>

            <li class = "nav-item">
              <a class="nav-link" href="{% url 'admin:index'%}">Admin</a>

            </li>

          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-4">
        <!-- Servirà per inserire i contenuti della pagina -->
        {% block content %}
        
        {% endblock content %}

        <!-- Servirà per inserire il codice javascript -->
        {% block script %}
        {% endblock script %}
    </div>

</body>
</html>
